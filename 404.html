<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Simple redirect to index.html preserving the path
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;

      // If we're already at index.html, don't redirect
      if (path.indexOf('/index.html') > -1) {
        // Already at index, do nothing
      } else {
        // Redirect to index.html in the same directory
        var indexPath = '/dashboard-psl/index.html';
        // Store the original path to be used by React Router
        sessionStorage.setItem('redirectedFrom', path + search + hash);
        window.location.href = indexPath + '?redirectedTo=' + encodeURIComponent(path);
      }
    </script>
  </head>
  <body>
    Loading...
  </body>
</html>
